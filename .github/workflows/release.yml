name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        run: |
          npm run --prefix web build
          python scripts/web-to-header.py web/dist -o lib/WebService/generated

      - name: Resolve version
        id: version
        run: |
          # Get version from git tag
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF##*/}"
          else
            VERSION=$(git describe --tags --always)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version $VERSION"

      - name: Build firmware
        run: pio run -e esp32c3

      - name: Firmware size
        run: pio run -e esp32c3 -t size

      - name: Package binaries
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p binaries/esp32c3
          cp .pio/build/esp32c3/firmware.bin binaries/esp32c3/automaticchickenfeeder-${VERSION}.bin
          cp .pio/build/esp32c3/firmware.elf binaries/esp32c3/automaticchickenfeeder-${VERSION}.elf
          ls -lh binaries/esp32c3

      - name: Generate release body
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cat > release-body.md <<'EOF'
          ## 🐔 Flash this release

          ### OTA update

          1. Connect to `ChickenFeeder` WiFi.
          2. Open `http://192.168.4.1`.
          3. Go to **Maintenance** -> **Firmware Update (OTA)**.
          4. Upload `automaticchickenfeeder-__VERSION__.bin`.
          5. Wait for the device to reboot.

          ### Files

          - `automaticchickenfeeder-__VERSION__.bin`: firmware for OTA upload or normal flashing
          - `automaticchickenfeeder-__VERSION__.elf`: debug symbols for troubleshooting

          ### Build locally

          - Local toolchain: `make build`
          - Nix: `nix-shell` then `make build`

          Local output: `.pio/build/esp32c3/firmware.bin`
          EOF

          sed -i "s/__VERSION__/${VERSION}/g" release-body.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/esp32c3/*
          body_path: release-body.md
          draft: false
          prerelease: false
