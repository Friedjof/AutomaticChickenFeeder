name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build web assets
        run: |
          npm run --prefix web build
          python scripts/web-to-header.py web/dist -o lib/WebService/generated

      - name: Resolve version
        id: version
        run: |
          # Get version from git tag
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF##*/}"
          else
            VERSION=$(git describe --tags --always)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Using version $VERSION"

      - name: Build firmware
        run: pio run -e esp32c3

      - name: Firmware size
        run: pio run -e esp32c3 -t size

      - name: Package binaries
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          mkdir -p binaries/esp32c3
          cp .pio/build/esp32c3/firmware.bin binaries/esp32c3/automaticchickenfeeder-${VERSION}.bin
          cp .pio/build/esp32c3/firmware.elf binaries/esp32c3/automaticchickenfeeder-${VERSION}.elf
          ls -lh binaries/esp32c3

      - name: Generate release body
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname 'v*.*.*' | grep -Fxv "${VERSION}" | head -n 1 || true)
          export PREVIOUS_TAG

          if [ -n "${PREVIOUS_TAG}" ]; then
            gh api "repos/${REPO}/compare/${PREVIOUS_TAG}...${VERSION}" > compare.json
          else
            printf '{"commits":[]}' > compare.json
          fi

          python3 - <<'PY'
          import json
          import os

          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          previous_tag = os.environ.get("PREVIOUS_TAG", "").strip()

          with open("compare.json", "r", encoding="utf-8") as handle:
              compare = json.load(handle)

          commits = compare.get("commits", [])

          contributors = []
          seen = set()
          for item in commits:
              author = item.get("author")
              if not author:
                  continue
              login = author.get("login")
              url = author.get("html_url")
              if not login or not url or login in seen:
                  continue
              seen.add(login)
              contributors.append((login, url))

          lines = [
              "## 🐔 Flash this release",
              "",
              "### OTA update",
              "",
              "1. Connect to `ChickenFeeder` WiFi.",
              "2. Open `http://192.168.4.1`.",
              "3. Go to **Maintenance** -> **Firmware Update (OTA)**.",
              f"4. Upload `automaticchickenfeeder-{version}.bin`.",
              "5. Wait for the device to reboot.",
              "",
              "### Files",
              "",
              f"- `automaticchickenfeeder-{version}.bin`: firmware for OTA upload or normal flashing",
              f"- `automaticchickenfeeder-{version}.elf`: debug symbols for troubleshooting",
              "",
              "### Build locally",
              "",
              "- Local toolchain: `make build`",
              "- Nix: `nix-shell` then `make build`",
              "",
              "Local output: `.pio/build/esp32c3/firmware.bin`",
              "",
              "## Contributors",
              "",
          ]

          if contributors:
              lines.append("<p>")
              for login, url in contributors:
                  lines.append(
                      f'  <a href="{url}"><img src="https://github.com/{login}.png?size=96" width="56" height="56" alt="@{login}" /></a>'
                  )
              lines.append("</p>")
          else:
              lines.append("No linked GitHub contributor profiles found for this range.")

          lines.extend(["", f"## Changes since {previous_tag}" if previous_tag else "## Changes in this release", ""])

          if commits:
              for item in commits:
                  sha = item.get("sha", "")[:7]
                  url = item.get("html_url", f"https://github.com/{repo}/commit/{item.get('sha', '')}")
                  message = item.get("commit", {}).get("message", "").splitlines()[0].replace("`", "'")
                  author = item.get("author")
                  if author and author.get("login") and author.get("html_url"):
                      author_md = f"[@{author['login']}]({author['html_url']})"
                  else:
                      author_md = item.get("commit", {}).get("author", {}).get("name", "unknown")
                  lines.append(f"- [`{sha}`]({url}) `{message}` - {author_md}")
          else:
              lines.append("- First tagged release in this series.")

          lines.extend(["", "## Full changelog", ""])

          if previous_tag:
              lines.append(f"- [Compare {previous_tag}...{version}](https://github.com/{repo}/compare/{previous_tag}...{version})")
          else:
              lines.append(f"- [Repository commits](https://github.com/{repo}/commits/{version})")

          with open("release-body.md", "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: binaries/esp32c3/*
          body_path: release-body.md
          draft: false
          prerelease: false
